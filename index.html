<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZEN</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent !important;
  }

  #zen-widget {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: transparent;
  }

  /* Marco HUD alrededor del texto */
  #hud {
    position: relative;
    z-index: 2;
    font-size: clamp(48px, 14vmin, 220px);
    padding: .22em .55em;
  }
  #hud .c {
    position: absolute;
    width: .32em;
    height: .32em;
    border: 0 solid #fff;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 0 16px rgba(255,255,255,.45));
    opacity: .9;
    transition: opacity .1s;
  }
  #hud .tl { top: 0;    left: 0;  border-top-width: .04em;    border-left-width: .04em; }
  #hud .tr { top: 0;    right: 0; border-top-width: .04em;    border-right-width: .04em; }
  #hud .bl { bottom: 0; left: 0;  border-bottom-width: .04em; border-left-width: .04em; }
  #hud .br { bottom: 0; right: 0; border-bottom-width: .04em; border-right-width: .04em; }
  #hud.glitching .c { animation: bracketFlicker 1.15s steps(1, end); }

  @keyframes bracketFlicker {
    0%, 100% { opacity: .9; transform: none; }
    10% { opacity: .2; transform: translate(-6px, 0); }
    22% { opacity: 1;  transform: translate(5px, 0); }
    37% { opacity: .1; }
    52% { opacity: 1;  transform: translate(-4px, 2px); }
    70% { opacity: .3; transform: none; }
    85% { opacity: 1;  transform: translate(3px, 0); }
  }

  #word {
    position: relative;
    text-align: center;
    color: #fff;
    font: 900 1em/1 "Segoe UI", "Arial Black", Arial, sans-serif;
    letter-spacing: .08em;
    white-space: nowrap;
    text-shadow:
      0 0 3px #fff,
      0 0 10px rgba(255,255,255,.85),
      0 0 26px rgba(255,255,255,.45),
      0 0 50px rgba(200,200,200,.3);
    animation: idlePulse 3.5s ease-in-out infinite;
  }

  @keyframes idlePulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.15); }
  }

  /* Capas de separación RGB en blanco / gris */
  #word::before,
  #word::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    width: 100%;
    text-align: center;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    letter-spacing: inherit;
  }
  #word::before { color: #ffffff; text-shadow: 3px 0 #ffffff; }
  #word::after  { color: #8a8a8a; text-shadow: -3px 0 #8a8a8a; }

  #word.glitch { animation: corrupt 1.15s steps(1, end); }
  #word.glitch::before { opacity: .9; animation: glitchA 1.15s steps(1, end); }
  #word.glitch::after  { opacity: .9; animation: glitchB 1.15s steps(1, end); }

  @keyframes corrupt {
    0%   { transform: translate(0) skew(0); filter: none; opacity: 1; clip-path: inset(0); }
    8%   { transform: translate(-5px, 2px) skew(-12deg); filter: brightness(1.8); }
    11%  { clip-path: inset(0 0 60% 0); transform: translate(-14px, 0); }
    13%  { clip-path: inset(0); transform: translate(6px, -2px) skew(15deg); }
    19%  { transform: translate(-3px, 0) scaleX(1.12); filter: blur(1px); }
    23%  { clip-path: inset(45% 0 20% 0); transform: translate(18px, 0); }
    27%  { clip-path: inset(0); transform: translate(4px, 1px) skew(-8deg); opacity: .25; }
    34%  { transform: translate(-7px, -1px); opacity: 1; }
    38%  { clip-path: inset(70% 0 0 0); transform: translate(-16px, 3px); }
    42%  { clip-path: inset(0); transform: translate(5px, 0) scaleX(.88); filter: blur(2px); }
    49%  { transform: translate(0) skew(0); opacity: .15; }
    52%  { clip-path: inset(15% 0 55% 0); transform: translate(12px, 0); opacity: 1; }
    57%  { clip-path: inset(0); transform: translate(3px, -2px); }
    65%  { transform: translate(-2px, 1px) skew(7deg); }
    74%  { transform: translate(0) scaleX(1.04); filter: none; }
    84%  { transform: translate(1px, 0); }
    100% { transform: translate(0) skew(0); filter: none; opacity: 1; clip-path: inset(0); }
  }

  @keyframes glitchA {
    0%, 100% { clip-path: inset(0 0 100% 0); transform: translateX(0); }
    10% { clip-path: inset(10% 0 65% 0); transform: translateX(-9px); }
    22% { clip-path: inset(55% 0 25% 0); transform: translateX(7px); }
    37% { clip-path: inset(25% 0 55% 0); transform: translateX(-12px); }
    51% { clip-path: inset(75% 0 8% 0);  transform: translateX(5px); }
    66% { clip-path: inset(40% 0 42% 0); transform: translateX(-5px); }
    82% { clip-path: inset(8% 0 78% 0);  transform: translateX(3px); }
  }

  @keyframes glitchB {
    0%, 100% { clip-path: inset(100% 0 0 0); transform: translateX(0); }
    12% { clip-path: inset(65% 0 10% 0); transform: translateX(10px); }
    25% { clip-path: inset(15% 0 65% 0); transform: translateX(-8px); }
    39% { clip-path: inset(45% 0 35% 0); transform: translateX(12px); }
    53% { clip-path: inset(5% 0 75% 0);  transform: translateX(-5px); }
    70% { clip-path: inset(70% 0 12% 0); transform: translateX(6px); }
    85% { clip-path: inset(30% 0 50% 0); transform: translateX(-3px); }
  }

  #snow {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
    background: transparent;
  }
</style>
</head>
<body>
<div id="zen-widget">
  <canvas id="snow"></canvas>
  <div id="hud">
    <span class="c tl"></span><span class="c tr"></span>
    <span class="c bl"></span><span class="c br"></span>
    <div id="word" data-text="ZEN">ZEN</div>
  </div>
</div>

<script>
  const hud = document.getElementById("hud");
  const word = document.getElementById("word");
  const canvas = document.getElementById("snow");
  const ctx = canvas.getContext("2d");

  const words = ["ZEN", "Roblox"];
  const INTERVAL_MS = 7000;

  let index = 0;
  let flakes = [];
  let width = 0, height = 0;
  let lastFrame = 0;
  let changing = false;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = rect.width || window.innerWidth;
    height = rect.height || window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.max(40, Math.min(110, Math.round(width * height / 15000)));
    flakes = Array.from({ length: count }, () => {
      const star = Math.random() < 0.14;   // estrellitas con destello
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        r: star ? 1.6 + Math.random() * 1.6 : 0.7 + Math.random() * 2.2,
        speed: 10 + Math.random() * 24,
        drift: (Math.random() - 0.5) * 12,
        alpha: 0.3 + Math.random() * 0.7,
        star,
        phase: Math.random() * Math.PI * 2,
        tw: 1.2 + Math.random() * 2.2
      };
    });
  }

  function drawSnow(time) {
    const dt = lastFrame ? Math.min((time - lastFrame) / 1000, 0.04) : 0.016;
    lastFrame = time;
    const t = time / 1000;
    ctx.clearRect(0, 0, width, height);

    for (const f of flakes) {
      const a = f.star
        ? f.alpha * (0.45 + 0.55 * Math.abs(Math.sin(t * f.tw + f.phase)))
        : f.alpha;

      ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
      ctx.shadowColor = "rgba(255,255,255,.9)";
      ctx.shadowBlur = f.r * 4;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();

      if (f.star) {
        const L = f.r * 4.5;
        ctx.shadowBlur = 0;
        ctx.strokeStyle = `rgba(255,255,255,${a * 0.8})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(f.x - L, f.y); ctx.lineTo(f.x + L, f.y);
        ctx.moveTo(f.x, f.y - L); ctx.lineTo(f.x, f.y + L);
        ctx.stroke();
      }

      f.y += f.speed * dt;
      f.x += f.drift * dt;

      if (f.y > height + 8) { f.y = -8; f.x = Math.random() * width; }
      if (f.x < -8) f.x = width + 8;
      if (f.x > width + 8) f.x = -8;
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(drawSnow);
  }

  function changeWord() {
    if (changing) return;
    changing = true;

    word.dataset.text = word.textContent;
    word.classList.remove("glitch");
    hud.classList.remove("glitching");
    void word.offsetWidth;
    word.classList.add("glitch");
    hud.classList.add("glitching");

    setTimeout(() => {
      index = (index + 1) % words.length;
      word.textContent = words[index];
      word.dataset.text = words[index];
    }, 580);

    setTimeout(() => {
      word.classList.remove("glitch");
      hud.classList.remove("glitching");
      changing = false;
    }, 1200);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(drawSnow);
  setInterval(changeWord, INTERVAL_MS);
</script>
</body>
</html>
