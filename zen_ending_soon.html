<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZEN - Stream Ending Soon</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

  #scene {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 115%, #1c1c20 0%, #060607 55%, #000 100%);
    font-family: "Segoe UI", "Arial Black", Arial, sans-serif;
  }
  #neb {
    position: absolute; inset: -5%;
    background:
      radial-gradient(40vmax 30vmax at 80% 15%, rgba(255,255,255,.055), transparent 70%),
      radial-gradient(35vmax 28vmax at 15% 85%, rgba(255,255,255,.045), transparent 70%);
    animation: nebmove 18s ease-in-out infinite alternate;
  }
  @keyframes nebmove { to { transform: scale(1.12) translate(-1.5%, 1%); } }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  #scan {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.30) 0 1px, transparent 1px 4px);
  }
  #sweep {
    position: absolute; left: 0; right: 0; height: 22vmin; top: -25vmin; pointer-events: none;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,.055), transparent);
    animation: sweep 6s linear infinite;
  }
  @keyframes sweep { to { top: 110%; } }

  /* ---------- Marco HUD ---------- */
  #hud { position: absolute; inset: 3.2vmin; pointer-events: none; }
  #hud .edge { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.28); }
  #hud .k {
    position: absolute; width: 10vmin; height: 10vmin; border: 0 solid #fff;
    filter: drop-shadow(0 0 5px rgba(255,255,255,.9)) drop-shadow(0 0 14px rgba(255,255,255,.4));
  }
  #hud .tl { top: -1px; left: -1px;  border-top-width: .9vmin; border-left-width: .9vmin; }
  #hud .tr { top: -1px; right: -1px; border-top-width: .9vmin; border-right-width: .9vmin; }
  #hud .bl { bottom: -1px; left: -1px;  border-bottom-width: .9vmin; border-left-width: .9vmin; }
  #hud .br { bottom: -1px; right: -1px; border-bottom-width: .9vmin; border-right-width: .9vmin; }
  #hud.glitching .k { animation: kflick 1.15s steps(1, end); }
  @keyframes kflick {
    0%,100% { opacity: 1; transform: none; }
    10% { opacity: .2; transform: translate(-6px,0); }
    22% { opacity: 1; transform: translate(5px,0); }
    37% { opacity: .1; }
    52% { opacity: 1; transform: translate(-4px,2px); }
    70% { opacity: .3; transform: none; }
    85% { opacity: 1; transform: translate(3px,0); }
  }
  #hud .dot { position: absolute; width: 1.2vmin; height: 1.2vmin; border-radius: 50%; background: #8a8a8a; box-shadow: 0 0 8px #fff; animation: dotp 2.4s ease-in-out infinite; }
  #hud .dot.l { left: -0.6vmin; } #hud .dot.r { right: -0.6vmin; }
  @keyframes dotp { 0%,100% { opacity: .35; } 50% { opacity: 1; background: #fff; } }
  #tab {
    position: absolute; top: 3.2vmin; left: 50%; transform: translateX(-50%);
    padding: .5vmin 5vmin; font: 700 2vmin/1 "Consolas", "DejaVu Sans Mono", monospace; letter-spacing: 1vmin;
    color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.8);
    background: #000; border: 1px solid rgba(255,255,255,.5); border-top: 0;
  }

  /* ---------- Centro ---------- */
  #center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3.2vmin; text-align: center; padding: 0 6vw;
  }
  #status {
    font: 700 2.2vmin/1 "Consolas", "DejaVu Sans Mono", monospace; letter-spacing: .8vmin;
    color: #cfcfcf; text-shadow: 0 0 8px rgba(255,255,255,.6);
  }
  #status i { display: inline-block; width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: #fff; margin-right: 1.4vmin; box-shadow: 0 0 10px #fff; animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #title { display: flex; flex-direction: column; align-items: center; }
  .ln {
    position: relative; display: block; color: #fff; text-align: center; white-space: nowrap;
    font: 900 min(15.2vw, 12.5vh)/1.04 "Segoe UI", "Arial Black", Arial, sans-serif; letter-spacing: .06em;
    text-shadow: 0 0 3px #fff, 0 0 12px rgba(255,255,255,.85), 0 0 30px rgba(255,255,255,.4), 0 0 60px rgba(200,200,200,.25);
    animation: pulse 3.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.15); } }
  .ln::before, .ln::after {
    content: attr(data-text); position: absolute; inset: 0; width: 100%; text-align: center;
    overflow: hidden; opacity: 0; pointer-events: none; letter-spacing: inherit;
  }
  .ln::before { color: #fff; text-shadow: 4px 0 #fff; }
  .ln::after  { color: #8a8a8a; text-shadow: -4px 0 #8a8a8a; }
  .ln.glitch { animation: corrupt 1.15s steps(1,end); }
  .ln.glitch::before { opacity: .9; animation: gA 1.15s steps(1,end); }
  .ln.glitch::after  { opacity: .9; animation: gB 1.15s steps(1,end); }
  @keyframes corrupt {
    0% { transform: none; filter: none; opacity: 1; clip-path: inset(0); }
    8% { transform: translate(-6px,2px) skew(-12deg); filter: brightness(1.8); }
    11% { clip-path: inset(0 0 60% 0); transform: translate(-16px,0); }
    13% { clip-path: inset(0); transform: translate(7px,-2px) skew(15deg); }
    19% { transform: translate(-3px,0) scaleX(1.08); filter: blur(1px); }
    23% { clip-path: inset(45% 0 20% 0); transform: translate(20px,0); }
    27% { clip-path: inset(0); transform: translate(4px,1px) skew(-8deg); opacity: .25; }
    34% { transform: translate(-8px,-1px); opacity: 1; }
    38% { clip-path: inset(70% 0 0 0); transform: translate(-18px,3px); }
    42% { clip-path: inset(0); transform: translate(5px,0) scaleX(.92); filter: blur(2px); }
    49% { transform: none; opacity: .15; }
    52% { clip-path: inset(15% 0 55% 0); transform: translate(14px,0); opacity: 1; }
    57% { clip-path: inset(0); transform: translate(3px,-2px); }
    65% { transform: translate(-2px,1px) skew(7deg); }
    74% { transform: scaleX(1.03); filter: none; }
    100% { transform: none; filter: none; opacity: 1; clip-path: inset(0); }
  }
  @keyframes gA {
    0%,100% { clip-path: inset(0 0 100% 0); transform: translateX(0); }
    10% { clip-path: inset(10% 0 65% 0); transform: translateX(-10px); }
    22% { clip-path: inset(55% 0 25% 0); transform: translateX(8px); }
    37% { clip-path: inset(25% 0 55% 0); transform: translateX(-14px); }
    51% { clip-path: inset(75% 0 8% 0); transform: translateX(6px); }
    66% { clip-path: inset(40% 0 42% 0); transform: translateX(-6px); }
    82% { clip-path: inset(8% 0 78% 0); transform: translateX(4px); }
  }
  @keyframes gB {
    0%,100% { clip-path: inset(100% 0 0 0); transform: translateX(0); }
    12% { clip-path: inset(65% 0 10% 0); transform: translateX(11px); }
    25% { clip-path: inset(15% 0 65% 0); transform: translateX(-9px); }
    39% { clip-path: inset(45% 0 35% 0); transform: translateX(14px); }
    53% { clip-path: inset(5% 0 75% 0); transform: translateX(-6px); }
    70% { clip-path: inset(70% 0 12% 0); transform: translateX(7px); }
    85% { clip-path: inset(30% 0 50% 0); transform: translateX(-4px); }
  }

  #sub { font: 700 2.8vmin/1 "Consolas", "DejaVu Sans Mono", monospace; letter-spacing: .6vmin; color: #e6e6e6; text-shadow: 0 0 10px rgba(255,255,255,.7); min-height: 2.8vmin; }
  #count { font: 800 6vmin/1 "Consolas", "DejaVu Sans Mono", monospace; letter-spacing: 1vmin; color: #fff; text-shadow: 0 0 14px rgba(255,255,255,.8); display: none; }
  #bar { position: relative; width: min(62vw, 70vh); height: .7vmin; background: rgba(255,255,255,.15); overflow: hidden; }
  #bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 22%; background: #fff; box-shadow: 0 0 14px #fff; animation: scanbar 2.2s ease-in-out infinite alternate; }
  @keyframes scanbar { from { left: 0; } to { left: 78%; } }

  /* ---------- Discord ---------- */
  #dc {
    position: absolute; left: 50%; bottom: 8vmin; transform: translateX(-50%);
    padding: 1.8vmin 4vmin 2.2vmin; border: 2px solid rgba(255,255,255,.9);
    box-shadow: 0 0 14px rgba(255,255,255,.35), inset 0 0 14px rgba(255,255,255,.12);
    background: rgba(0,0,0,.55); text-align: left;
  }
  #dc small { display: block; font: 700 2vmin/1 "Consolas", "DejaVu Sans Mono", monospace; letter-spacing: .6vmin; color: #9a9a9a; margin-bottom: 1.2vmin; }
  #dc b { display: block; font: 800 5vmin/1 "Consolas", "DejaVu Sans Mono", monospace; color: #fff; text-shadow: 0 0 12px rgba(255,255,255,.75); }

  /* Horizontal: título en una sola fila */
  @media (orientation: landscape) {
    #title { flex-direction: row; gap: 2.2vw; }
    .ln { font-size: 5.6vw; }
    #dc { bottom: 6vmin; }
  }
</style>
</head>
<body>
<div id="scene">
  <div id="neb"></div>
  <canvas id="stars"></canvas>
  <div id="sweep"></div>
  <div id="hud">
    <div class="edge"></div>
    <span class="k tl"></span><span class="k tr"></span><span class="k bl"></span><span class="k br"></span>
    <span class="dot l" style="top:30%"></span><span class="dot l" style="top:34%;animation-delay:.6s"></span>
    <span class="dot r" style="top:30%;animation-delay:.3s"></span><span class="dot r" style="top:34%;animation-delay:.9s"></span>
    <span class="dot l" style="top:66%;animation-delay:1.2s"></span><span class="dot l" style="top:70%;animation-delay:1.5s"></span>
    <span class="dot r" style="top:66%;animation-delay:1.8s"></span><span class="dot r" style="top:70%;animation-delay:2.1s"></span>
  </div>
  <div id="tab">ZEN</div>

  <div id="center">
    <div id="status"><i></i>SIGNAL // ENDING</div>
    <div id="title"></div>
    <div id="count">00:00</div>
    <div id="bar"></div>
    <div id="sub"></div>
  </div>

  <div id="dc"><small>DISCORD //</small><b id="dcname">exhibitreplay</b></div>
  <div id="scan"></div>
</div>

<script>
  // ---- Parámetros por URL (opcionales) ----
  // ?t=STREAM ENDING SOON  &sub=thanks for watching  &discord=exhibitreplay  &min=10
  const P = new URLSearchParams(location.search);
  const TITLE = (P.get("t") || "STREAM ENDING SOON").toUpperCase();
  const SUBS  = P.get("sub") ? [P.get("sub")] : ["thanks for watching", "see you next time"];
  const DISCORD = P.has("discord") ? P.get("discord") : "exhibitreplay";
  const MINUTES = parseFloat(P.get("min"));

  const titleEl = document.getElementById("title");
  const subEl = document.getElementById("sub");
  const hud = document.getElementById("hud");
  let lines = [];
  TITLE.split(/\s+/).filter(Boolean).forEach(w => {
    const d = document.createElement("div");
    d.className = "ln"; d.textContent = w; d.dataset.text = w;
    titleEl.appendChild(d); lines.push(d);
  });
  subEl.textContent = SUBS[0];
  if (!DISCORD) document.getElementById("dc").style.display = "none";
  else document.getElementById("dcname").textContent = DISCORD;

  // ---- Cuenta regresiva opcional ----
  if (!isNaN(MINUTES) && MINUTES > 0) {
    const cEl = document.getElementById("count"); cEl.style.display = "block";
    const end = Date.now() + MINUTES * 60000;
    const tick = () => {
      const s = Math.max(0, Math.round((end - Date.now()) / 1000));
      cEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    };
    tick(); setInterval(tick, 250);
  }

  // ---- Estrellas + estrellas fugaces ----
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  let W = 0, H = 0, stars = [], meteors = [], last = 0, nextMeteor = 1500;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(120, Math.min(420, Math.round(W * H / 5500)));
    stars = Array.from({ length: n }, () => {
      const big = Math.random() < 0.08;
      return { x: Math.random() * W, y: Math.random() * H,
        r: big ? 1.4 + Math.random() * 1.4 : 0.4 + Math.random() * 1.2,
        a: 0.35 + Math.random() * 0.65, ph: Math.random() * 6.28, tw: 0.8 + Math.random() * 2.4,
        vy: 2 + Math.random() * 6, big };
    });
  }
  function frame(t) {
    const dt = last ? Math.min((t - last) / 1000, 0.05) : 0.016; last = t;
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = s.a * (0.5 + 0.5 * Math.abs(Math.sin(t / 1000 * s.tw + s.ph)));
      ctx.fillStyle = "rgba(255,255,255," + a + ")";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      if (s.big) {
        const L = s.r * 5; ctx.strokeStyle = "rgba(255,255,255," + a * 0.7 + ")"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(s.x - L, s.y); ctx.lineTo(s.x + L, s.y); ctx.moveTo(s.x, s.y - L); ctx.lineTo(s.x, s.y + L); ctx.stroke();
      }
      s.y += s.vy * dt; if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    }
    nextMeteor -= dt * 1000;
    if (nextMeteor <= 0) {
      meteors.push({ x: W * (0.3 + Math.random() * 0.7), y: -20, vx: -(500 + Math.random() * 400), vy: 380 + Math.random() * 300, life: 1 });
      nextMeteor = 2500 + Math.random() * 4500;
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i]; m.x += m.vx * dt; m.y += m.vy * dt; m.life -= dt * 0.7;
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 0.22, m.y - m.vy * 0.22);
      g.addColorStop(0, "rgba(255,255,255," + Math.max(m.life, 0) + ")"); g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 0.22, m.y - m.vy * 0.22); ctx.stroke();
      if (m.life <= 0 || m.y > H + 40 || m.x < -40) meteors.splice(i, 1);
    }
    requestAnimationFrame(frame);
  }
  resize(); addEventListener("resize", resize); requestAnimationFrame(frame);

  // ---- Glitch periódico ----
  let subIdx = 0, busy = false;
  function glitch() {
    if (busy) return; busy = true;
    lines.forEach((l, i) => { l.classList.remove("glitch"); l.style.animationDelay = (i * 70) + "ms"; });
    hud.classList.remove("glitching"); void hud.offsetWidth;
    lines.forEach(l => { l.classList.add("glitch"); l.style.setProperty("--d", "0"); });
    lines.forEach((l, i) => {
      l.style.animationDelay = (i * 70) + "ms";
    });
    hud.classList.add("glitching");
    if (SUBS.length > 1) setTimeout(() => { subIdx = (subIdx + 1) % SUBS.length; subEl.textContent = SUBS[subIdx]; }, 580);
    setTimeout(() => { lines.forEach(l => { l.classList.remove("glitch"); l.style.animationDelay = ""; }); hud.classList.remove("glitching"); busy = false; }, 1400);
  }
  setTimeout(glitch, 1200);
  setInterval(glitch, 4500);
</script>
</body>
</html>
